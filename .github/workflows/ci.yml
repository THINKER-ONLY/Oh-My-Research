name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -B -m unittest discover -s tests -v
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Build release
        run: python tools/build_release.py
      - name: List release archive
        run: python -m zipfile -l dist/research-writing.zip
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/research-writing.zip
          if-no-files-found: error
          retention-days: 1

  compare-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false
      - name: Compare Linux and Windows release bytes
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path

          archives = sorted(Path("artifacts").glob("release-*/research-writing.zip"))
          if len(archives) != 2:
              raise SystemExit(f"expected two release archives, found {archives!r}")

          payloads = []
          for archive in archives:
              payload = archive.read_bytes()
              print(f"{archive}: sha256={sha256(payload).hexdigest()}")
              payloads.append(payload)

          if payloads[0] != payloads[1]:
              raise SystemExit("release archives differ")
